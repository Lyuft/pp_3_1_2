<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>

<h2> That's all Users! </h2>

<table>

    <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Login</th>
        <th>Password</th>
        <th>Role</th>
        <th>Operations</th>
    </tr>

    <tr th:each="user : ${allUsers}">

        <td th:text="${user.getFirstName()}"></td>
        <td th:text="${user.getSecondName()}"></td>
        <td th:text="${user.getDepartment()}"></td>
        <td th:text="${user.getSalary()}"></td>
        <td th:text="${user.getUsername()}"></td>
        <td th:text="${user.getPassword()}"></td>
        <td>
            <span th:each="role : ${user.roles}" th:text="' ' + ${role.role} + ' ' "></span>
        </td>
        <td>
            <form th:action="@{/admin/updateInfo}" method="get" style="display: inline;">
                <input type="hidden" name="id" th:value="${user.getId()}"/>
                <button type="submit" class="btn-update">Update</button>
            </form>
            <form th:action="@{/admin/deleteUser}" method="post" style="display: inline;">
                <input type="hidden" name="id" th:value="${user.getId()}"/>
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </td>

    </tr>

</table>
<br><br>

<input type="button" value="Add" onclick="window.location.href = '/admin/addNewUser' ">
<br><br>

<input type="button" value="LogOut" onclick="window.location.href= '/logout' ">

</body>

</html>
